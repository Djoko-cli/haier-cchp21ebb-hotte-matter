<text x="220.0" y="346.4" font-size="13.0" fill="#1b1f23" text-anchor="end" font-weight="bold">15,24 mm</text>
<text x="220.0" y="363.4" font-size="12.5" fill="#5f6670" text-anchor="end">(6 trous)</text>
<text x="752.2" y="374.4" font-size="12.5" fill="#5f6670" text-anchor="start">carte d'environ 25,6 × 17,7 mm</text>
<text x="24.0" y="680.0" font-size="15.0" fill="#1b1f23" text-anchor="start" font-weight="bold">À retenir</text>
<text x="24.0" y="704.0" font-size="13.5" fill="#d62828" text-anchor="start" font-weight="bold">• GPIO6 et GPIO7 sont VOISINES, au bout de la rangée du bas, côté antenne : 6 est l'avant-dernière, 7 la dernière (le coin).</text>
<text x="24.0" y="728.0" font-size="13.5" fill="#d62828" text-anchor="start">  Les intervertir est facile et dangereux (WIRING §6) : le fil vert va sur 6 ; le 4,7k de l'injection, sur 7.</text>
<text x="24.0" y="752.0" font-size="13.5" fill="#1b1f23" text-anchor="start">• Rangée du haut, depuis l'USB-C : 5V, GND, 3V3. Trous intérieurs 12, 13, 21, 22, 23 et pastille BAT : inutilisés.</text>
<text x="24.0" y="776.0" font-size="13.5" fill="#1b1f23" text-anchor="start">• Sur le boîtier, le module est tourné d'un quart de tour : USB-C vers le haut de la plaque, rangée TX…7 en colonne 18, rangée 5V…8 en colonne 24.</text>
<text x="24.0" y="800.0" font-size="13.5" fill="#1b1f23" text-anchor="start">• Toujours composants en haut : retourné, le module présenterait ses broches en miroir.</text>
</svg>
