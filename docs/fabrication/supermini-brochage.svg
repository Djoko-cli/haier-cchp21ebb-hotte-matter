<text x="24.0" y="36.0" font-size="23.0" fill="#1b1f23" text-anchor="start" font-weight="bold">ESP32-C6 SuperMini violette — brochage réel (relevé le 28/09)</text>
<text x="24.0" y="62.0" font-size="13.5" fill="#5f6670" text-anchor="start">Vue côté composants, USB-C à gauche, antenne céramique à droite. 10 pastilles par rangée ; rangées à 6 trous (15,24 mm) l'une de l'autre.</text>
