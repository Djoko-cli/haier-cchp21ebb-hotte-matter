; Hotte Haier CCHP21EBB, sur ESP32-C6 SuperMini : sonde de reconnaissance de la
; ligne D (sous-projet 1, docs/SPEC-RECONNAISSANCE.md) et son generateur de
; banc ; module produit Matter sur Thread (sous-projet 2, docs/SPEC-PRODUIT.md).
;
; Meme plateforme que benq-screenbar-halo-matter (commit c58a506) : pioarduino
; 55.03.312-1, soit le coeur Arduino-ESP32 3.3.12 et IDF 5.5. PlatformIO ne
; garde qu'un coeur : les deux projets partagent le cache de paquets. Pas de
; Matter : table de partitions par defaut.

[platformio]
default_envs = sonde

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; log2file : ecrit toute la session serie dans platformio-device-monitor-*.log
; (ignore par git), pour relire une capture sans dependre du terminal.
monitor_filters = esp32_exception_decoder, time, log2file
; C6 SuperMini : pas de definition dans PlatformIO, on part de la DevKitC-1
; (meme puce) avec une flash de 4 Mo au lieu de 8.
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Serial sur l'USB Serial/JTAG materiel du C6, des le demarrage.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Version du firmware, pour src/ seulement (mecanisme de la ScreenBar) :
; FW_VERSION a la main, FW_GIT_REV par tools/git_rev.py (hash court, "-dirty"
; si l'arbre differe du commit), FW_ENV = nom de l'env ($PIOENV). Ensemble,
; "0.1.0-<commit>" : version affichee au demarrage, rapportee par hello.fw et
; par le descripteur d'application (src/app_desc.c, hello.fw_desc). Les envs
; qui ont leur propre build_src_flags doivent reprendre ${env.build_src_flags}.
build_src_flags =
    -DFW_VERSION='"0.1.0"'
    -DFW_ENV='"${PIOENV}"'
    !python3 tools/git_rev.py

; ---------------------------------------------------------------------------
; Sonde : ecoute de la ligne D sur GPIO6, injection sur GPIO7 (src/config.h).
; ---------------------------------------------------------------------------
[env:sonde]
; gen_main.cpp est le firmware du generateur (env generateur) : pas dans la
; sonde ; src/produit/ est le module du produit (env produit).
build_src_filter = +<*> -<gen_main.cpp> -<produit/>

; ---------------------------------------------------------------------------
; Generateur du banc (spec section 10) : second C6 qui imite la ligne D avec
; des motifs a contenu connu, sur GPIO7 (src/config.h : kPinGenerateur), par
; le RMT en emission. Le NPN du banc inverse : GPIO haut = ligne basse.
; Sources : gen_main.cpp, motifs.cpp (partage avec les tests hote) et
; app_desc.c (version, comme la sonde).
; ---------------------------------------------------------------------------
[env:generateur]
build_src_filter = -<*> +<gen_main.cpp> +<motifs.cpp> +<app_desc.c>

; ---------------------------------------------------------------------------
; Produit (sous-projet 2, docs/SPEC-PRODUIT.md 4.7) : noeud Matter sur Thread,
; EP1 Ventilateur, EP2 Lumiere, canal compagnon profil "hotte". Pilote de ligne
; SIMULE tant que l'etape 6 n'a pas choisi A, B ou C (second plan) : aucune
; broche pilotee, GPIO1 tenue basse. Image Matter : partitions huge_app
; (3 Mo d'application, pas d'OTA). Premier flash (Thread) : -t erase, puis
; -t upload.
; ---------------------------------------------------------------------------
[env:produit]
board_build.partitions = huge_app.csv
; Modules du produit, plus les modules purs partages avec la sonde.
build_src_filter = -<*> +<produit/> +<h1_proto.cpp> +<h1_crypto.cpp> +<app_desc.c>
build_flags =
    ${env.build_flags}
    -DPILOTE_SIMULE=1
    -DPILOTE_LIGNE_TEXTE='"simule"'
    ; Les quatre lignes du role Thread vont ensemble (4.7). MATTER_THREAD_MED=0 :
    ; eligible routeur quand la NVS est vide ('matter med 1' : MED des l'init).
    ; L'enveloppe et l'option de l'editeur de liens : l'une sans l'autre ne lie pas.
    -DMATTER_NET_THREAD=1
    -DMATTER_THREAD_MED=0
    -DHALO_WRAP_THREAD_DEVTYPE=1
    -Wl,--wrap=_ZN4chip11DeviceLayer8Internal40GenericThreadStackManagerImpl_OpenThreadINS0_22ThreadStackManagerImplEE20_SetThreadDeviceTypeENS0_19ConnectivityManager16ThreadDeviceTypeE
